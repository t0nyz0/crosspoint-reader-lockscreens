name: Compile Release

# Builds every board's release firmware on tag push, with the .bin named
# exactly as OtaUpdater requests it from the GitHub release: plain
# firmware.bin for the C3 X4/X3 binary, firmware-<board>.bin for every other
# board. Attach the artifacts' .bin files to the release as-is.

on:
  push:
    tags:
      # [Lock Screens fork] Only this fork's release tags (v<base>-lockscreens.<N>),
      # so pushing upstream's tags to the fork never starts a release build.
      - 'v*-lockscreens.*'

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # [Lock Screens fork] This fork ships only the Xteink X4/X3 (ESP32-C3)
          # image. Its lock-screen timed-sleep uses C3-only deep-sleep GPIO wake
          # APIs, so the upstream sticky/x4pro/papermono (S3-class) targets don't
          # compile here and were never shipped. Build just gh_release, matching
          # the fork's pre-1.6.0 single-image release workflow.
          - pio_env: gh_release
            asset: firmware.bin
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # [Lock Screens fork] The in-device updater orders fork releases by the
      # "-lockscreens.N" in both the release tag and the firmware's own version
      # ([crosspoint] version). If they disagree, devices are offered the same
      # release forever (or never), so refuse to build a mismatched tag.
      - name: Check tag matches firmware version
        run: |
          VERSION=$(python3 -c "import configparser; c = configparser.ConfigParser(); c.read('platformio.ini', encoding='utf-8'); print(c.get('crosspoint', 'version'))")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match platformio.ini version v${VERSION}"
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches firmware version ${VERSION}"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          # platform-espressif32's builder/main.py imports these unconditionally; its own
          # penv bootstrap (builder/penv_setup.py) is supposed to install them automatically
          # but isn't picking them up reliably in this runner image, so pin them explicitly.
          uv pip install --system -U "littlefs-python>=0.16.0" "fatfs-ng>=0.1.14" "pyyaml>=6.0.2" \
            "rich-click>=1.8.6" "zopfli>=0.2.2" "intelhex>=2.3.0" "rich>=14.0.0" "urllib3<2" \
            "cryptography>=45.0.3" "certifi>=2025.8.3" "ecdsa>=0.19.1" "bitstring>=4.3.1" \
            "reedsolo>=1.5.3,<1.8" "esp-idf-size>=2.0.0" "esp-coredump>=1.14.0"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e ${{ matrix.pio_env }} -j1

      - name: Name release asset
        run: |
          if [ "${{ matrix.asset }}" != "firmware.bin" ]; then
            cp ".pio/build/${{ matrix.pio_env }}/firmware.bin" \
              ".pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            .pio/build/${{ matrix.pio_env }}/bootloader.bin
            .pio/build/${{ matrix.pio_env }}/${{ matrix.asset }}
            .pio/build/${{ matrix.pio_env }}/firmware.elf
            .pio/build/${{ matrix.pio_env }}/firmware.map
            .pio/build/${{ matrix.pio_env }}/partitions.bin
